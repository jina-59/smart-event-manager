<style>

    .section-title {

    .modern-booking-item {

    .poster-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
    }

    /* 4. 마우스 호버 시 극적인 변화 */
    .modern-booking-item:hover {
        background: #ffffff;

    }
    .modern-booking-item:hover .poster-wrapper img {

    .modern-booking-item:hover .arrow-icon {

    .event-info-main { flex-grow: 1; }
    .event-category {
