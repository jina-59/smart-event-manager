<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Event | Smart Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
        }
        body { background-color: #f8f9fa; }
        .booking-card { border-radius: 15px; border: none; }
        .summary-box { background-color: #fff; border-radius: 10px; }
        .step-badge {
            width: 30px; height: 30px;
            background-color: var(--primary-color);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SmartEvent</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Explore Events</a></li>
                </ul>
                <span class="navbar-text text-light">Jina HWANG (Student)</span>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <h2 class="fw-bold mb-4">Complete Your Booking</h2>
                
                <div class="card shadow-sm booking-card p-4 mb-4">
                    <h5 class="mb-4"><span class="step-badge">1</span>Select Tickets</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Ticket Type</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <div class="fw-bold">Standard Ticket</div>
                                        <small class="text-muted">General admission to the event</small>
                                    </td>
                                    <td>€<span id="price-standard">50</span></td>
                                    <td style="width: 120px;">
                                        <input type="number" class="form-control qty-input" id="qty-standard" value="0" min="0" max="10">
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="fw-bold text-primary">VIP Pass</div>
                                        <small class="text-muted">Front row seat + Networking lunch</small>
                                    </td>
                                    <td>€<span id="price-vip">120</span></td>
                                    <td>
                                        <input type="number" class="form-control qty-input" id="qty-vip" value="0" min="0" max="5">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
