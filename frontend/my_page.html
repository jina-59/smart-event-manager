<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page | Smart Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --sidebar-width: 250px; }
        body { background-color: #f4f7f6; }
        .profile-header {
            background: white;
            border-bottom: 1px solid #dee2e6;
            padding: 30px 0;
        }
        .stat-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .sidebar-link {
            text-decoration: none;
            color: #495057;
            padding: 10px 15px;
            display: block;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .event-history-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SmartEvent</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 small d-none d-md-block">Welcome, <strong>Jina HWANG</strong></span>
                <div class="dropdown">
                    <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=100&q=80" 
                         class="rounded-circle border border-2 border-primary" width="35" height="35" role="button" data-bs-toggle="dropdown">
                </div>
            </div>
        </div>
    </nav>

    <header class="profile-header mb-4">
        <div class="container">
            <div class="d-flex align-items-center gap-4">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=150&q=80" 
                     class="rounded-circle shadow-sm" width="100" height="100">
                <div>
                    <h2 class="fw-bold mb-1">Jina HWANG</h2>
                    <p class="text-muted mb-0"><i class="bi bi-mortarboard me-2"></i>Data Science Student @ ISEP Paris</p>
                    <span class="badge bg-primary-subtle text-primary mt-2">Active Member</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm p-3">
                    <nav class="nav flex-column gap-2">
                        <a href="#" class="sidebar-link active"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</a>
                        <a href="#" class="sidebar-link"><i class="bi bi-ticket-perforated me-2"></i>My Tickets</a>
                        <a href="#" class="sidebar-link"><i class="bi bi-star me-2"></i>My Reviews</a>
                        <a href="#" class="sidebar-link"><i class="bi bi-person me-2"></i>Profile Settings</a>
                        <hr>
                        <a href="index.html" class="sidebar-link text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
                    </nav>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 bg-white">
                            <div class="text-muted small fw-bold">TOTAL EVENTS</div>
                            <div class="h3 fw-bold">12</div>
                            <div class="text-success small"><i class="bi bi-arrow-up"></i> 2 more this month</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 bg-white text-primary">
                            <div class="text-muted small fw-bold">UPCOMING</div>
                            <div class="h3 fw-bold">2</div>
                            <div class="text-muted small">Next: March 30</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card shadow-sm p-3 bg-white text-warning">
                            <div class="text-muted small fw-bold">REVIEWS LEFT</div>
                            <div class="h3 fw-bold">8</div>
                            <div class="text-muted small">Earned 80 points</div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-4">Recent Bookings</h5>
                    
                    <div class="d-flex align-items-center justify-content-between p-3 border rounded-3 mb-3 bg-white shadow-sm">
                        <div class="d-flex align-items-center gap-3">
                            <img src="
