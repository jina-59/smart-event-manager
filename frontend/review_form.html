<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Event Review</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --star-color: #f1c40f;
            --bg-color: #f4f7f6;
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .review-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 { 
            margin-top: 0;
            text-align: center; 
            color: var(--text-main);
            font-weight: 700;
        }

        /* Read-only Event Details */
        .event-details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid var(--primary-color);
        }
        .event-details label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 2px;
        }
        .event-details span {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        /* Star Rating */
        .rating-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        .rating-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-main);
        }
        .stars {
            display: flex;
            justify-content: center;
            flex-direction: row-reverse;
        }
        .stars input { display: none; }
        .stars label {
            font-size: 2.2rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease-in-out;
            padding: 0 4px;
        }
        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: var(--star-color);
        }

        /* Feedback Textarea */
        .input-group { margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #dcdde1;
            border-radius: 10px;
            resize: none;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit { background-color: var(--primary-color); color: white; }
        .btn-cancel { background-color: #ecf0f1; color: #7f8c8d; }
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="review-card">
    <h2>Leave a Review</h2>

    <div class="event-details">
        <label>Event Title</label>
        <span>Global Tech Summit 2026</span>
        <div style="margin-top: 10px;"></div>
        <label>Date</label>
        <span>October 24, 2026</span>
    </div>

    <form id="reviewForm">
        <div class="rating-wrapper">
            <span class="rating-label">Rate your experience</span>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5"><label for="star5" class="fa-solid fa-star"></label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4" class="fa-solid fa-star"></label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3" class="fa-solid fa-star"></label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2" class="fa-solid fa-star"></label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1" class="fa-solid fa-star"></label>
            </div>
        </div>

        <div class="input-group">
            <textarea name="comment" placeholder="Tell us about your experience..." required></textarea>
        </div>

        <div class="actions">
            <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
            <button type="submit" class="btn-submit">Submit Review</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('reviewForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const rating = document.querySelector('input[name="rating"]:checked')?.value;
        const comment = this.comment.value;

        if(!rating) {
            alert('Please select a star rating.');
            return;
        }

        // Logic for data handling
        console.log("Submitting Review:", { 
            score: rating, 
            content: comment,
            timestamp: new Date().toISOString()
        });

        alert('Thank you! Your review has been submitted.');
    });
</script>

</body>
</html>
