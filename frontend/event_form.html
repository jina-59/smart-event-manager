<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Smart Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .section-title { border-left: 5px solid #0d6efd; padding-left: 15px; margin-bottom: 25px; font-weight: bold; }
        .error-banner { background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SmartEvent</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center fw-bold mb-5">Create New Event 🚀</h2>
            
            {% if error_message %}
            <div class="error-banner">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error_message }}
            </div>
            {% endif %}

            <form id="eventForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="section-title h5 text-primary">Basic Information</div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Event Title</label>
                    <input type="text" name="title" value="{{ event.title|default:'' }}" class="form-control" placeholder="e.g. Paris Data Science Meetup" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Event Description</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Write something about this event..." required>{{ event.description|default:'' }}</textarea>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="" disabled {% if not event.category %}selected{% endif %}>Select a Category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if event.category.id == cat.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Event Date & Time</label>
                        <input type="datetime-local" name="date" value="{{ event.date|date:'Y-m-d\TH:i' }}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Event Image</label>
                    <input type="file" name="image" class="form-control">
                </div>

                <div class="section-title h5 text-primary">Location & Type</div>
                <div class="mb-4">
                    <label class="form-label fw-semibold d-block">Select Event Type</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="eventType" id="offline" value="offline" checked>
                        <label class="btn btn-outline-primary" for="offline"><i class="bi bi-geo-alt me-2"></i>Offline</label>

                        <input type="radio" class="btn-check" name="eventType" id="online" value="online">
                        <label class="btn btn-outline-primary" for="online"><i class="bi bi-laptop me-2"></i>Online</label>

                        <input type="radio" class="btn-check" name="eventType" id="hybrid" value="hybrid">
                        <label class="btn btn-outline-primary" for="hybrid"><i class="bi bi-people me-2"></i>Hybrid</label>
                    </div>
                </div>

                <div id="locationField" class="mb-4">
                    <label class="form-label fw-semibold">Physical Address</label>
                    <input type="text" name="location" value="{{ event.location|default:'' }}" class="form-control" placeholder="Enter venue address in Paris">
                </div>

                <div id="linkField" class="mb-4 d-none">
                    <label class="form-label fw-semibold">Online Meeting Link</label>
                    <input type="url" name="meeting_link" class="form-control" placeholder="https://zoom.us/j/...">
                </div>

                <div class="section-title h5 text-primary">Ticketing</div>
                
                <div id="ticketContainer" class="mb-3">
                    <div class="row g-3 mb-2 ticket-row">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ticket Name</label>
                            <input type="text" name="ticket_name[]" class="form-control" value="Standard" placeholder="e.g. Standard, VIP, Early Bird" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Price (€)</label>
                            <input type="number" name="ticket_price[]" class="form-control" placeholder="50" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Capacity</label>
                            <input type="number" name="ticket_quota[]" class="form-control" placeholder="100" required>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <button type="button" id="addTicketBtn" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Add More Ticket Type
                    </button>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg shadow">Publish Event</button>
                    <a href="/" class="btn btn-link text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const offlineRadio = document.getElementById('offline');
        const onlineRadio = document.getElementById('online');
        const hybridRadio = document.getElementById('hybrid');
        const locationField = document.getElementById('locationField');
        const linkField = document.getElementById('linkField');

        function toggleFields() {
            if (offlineRadio.checked) {
                locationField.classList.remove('d-none');
                linkField.classList.add('d-none');
                linkField.querySelector('input').removeAttribute('required');
                locationField.querySelector('input').setAttribute('required', 'required');
            } else if (onlineRadio.checked) {
                locationField.classList.add('d-none');
                linkField.classList.remove('d-none');
                locationField.querySelector('input').removeAttribute('required');
                linkField.querySelector('input').setAttribute('required', 'required');
            } else if (hybridRadio.checked) {
                locationField.classList.remove('d-none');
                linkField.classList.remove('d-none');
                locationField.querySelector('input').setAttribute('required', 'required');
                linkField.querySelector('input').setAttribute('required', 'required');
            }
        }

        [offlineRadio, onlineRadio, hybridRadio].forEach(radio => {
            if (radio) {
                radio.addEventListener('change', toggleFields);
            }
        });

        document.addEventListener('DOMContentLoaded', toggleFields);

        async function initAutocomplete() {
            const locationInput = document.querySelector('input[name="location"]');
            
            if (locationInput) {
                const { Autocomplete } = await google.maps.importLibrary("places");
                
                const autocomplete = new Autocomplete(locationInput, {
                    fields: ["address_components", "formatted_address", "geometry"],
                    types: ["geocode", "establishment"],
                });

                autocomplete.addListener('place_changed', function() {
                    const place = autocomplete.getPlace();
                    console.log("Selected Place:", place.formatted_address);
                });
            }
        }
        const addTicketBtn = document.getElementById('addTicketBtn');
        if (addTicketBtn) {
            addTicketBtn.addEventListener('click', function() {
            const container = document.getElementById('ticketContainer');
            
            const newRow = document.createElement('div');
            newRow.className = 'row g-3 mb-2 ticket-row border-top pt-3 mt-2';
            newRow.innerHTML = `
                <div class="col-md-4">
                    <input type="text" name="ticket_name[]" class="form-control" placeholder="e.g. VIP, Early Bird" required>
                </div>
                <div class="col-md-4">
                    <input type="number" name="ticket_price[]" class="form-control" placeholder="100" required>
                </div>
                <div class="col-md-3">
                    <input type="number" name="ticket_quota[]" class="form-control" placeholder="50" required>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger w-100 remove-ticket-btn" title="Delete Ticket Type">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
            container.appendChild(newRow);

            newRow.querySelector('.remove-ticket-btn').addEventListener('click', function() {
                newRow.remove();
            });
        });
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDvW0-sPS1_C5yLH8XVxWwEVoW9Q6rfOmA&v=beta&loading=async&callback=initAutocomplete"></script>
</body>
</html>
